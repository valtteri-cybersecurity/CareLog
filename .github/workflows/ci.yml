name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Fresh, disposable database: never connects to a user's own database server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: carelog-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Credentials are only for the disposable CI database.
    env:
      CARELOG_TEST_PG_HOST: 127.0.0.1
      CARELOG_TEST_PG_PORT: "5432"
      CARELOG_TEST_PG_USER: postgres
      CARELOG_TEST_PG_PASSWORD: carelog-ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # The tests run only on a server marked as disposable.
      - name: Mark disposable PostgreSQL test server
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U postgres -c "COMMENT ON DATABASE postgres IS 'carelog-disposable-test-server'"

      - name: Run pytest
        run: python -m pytest -v -rs

